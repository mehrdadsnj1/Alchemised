<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتابخانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --text-color: #e6edf3;
    --text-muted: #8b949e;
    --accent: #a855f7;
    --accent-hover: #c084fc;
    --border-color: #30363d;
    --font-size: 19px;
    --line-height: 2.1;
    --max-width: 820px;
}

body.theme-sepia {
    --bg-color: #fbf0d9;
    --card-bg: #f4e4c1;
    --text-color: #433422;
    --text-muted: #79664f;
    --accent: #8c4a00;
    --accent-hover: #b86200;
    --border-color: #dec9a5;
}

body.theme-light {
    --bg-color: #ffffff;
    --card-bg: #f6f8fa;
    --text-color: #1f2328;
    --text-muted: #656d76;
    --accent: #7c3aed;
    --accent-hover: #9333ea;
    --border-color: #d0d7de;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: var(--line-height);
    direction: rtl;
    transition: background-color 0.3s, color 0.3s;
    overflow-x: hidden;
}

#navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    background-color: rgba(22, 27, 34, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
}

body.theme-sepia #navbar {
    background-color: rgba(244, 228, 193, 0.95);
}

body.theme-light #navbar {
    background-color: rgba(246, 248, 250, 0.95);
}

.nav-brand {
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
}

.btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 6px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
}

.btn:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
}

.btn:active {
    transform: scale(0.96);
}

.main-container {
    max-width: var(--max-width);
    margin: 100px auto 60px auto;
    padding: 0 24px;
}

.hero {
    text-align: center;
    padding: 40px 20px;
    margin-bottom: 40px;
    border-bottom: 2px dashed var(--border-color);
}

.hero h1 {
    font-size: 2.6rem;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #c084fc, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

body.theme-sepia .hero h1 {
    background: linear-gradient(135deg, #8c4a00, #b86200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

body.theme-light .hero h1 {
    background: linear-gradient(135deg, #7c3aed, #db2777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: var(--text-muted);
    font-size: 1.1rem;
}

.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
}

.book-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none;
    color: var(--text-color);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.book-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.book-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
}

.book-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--accent);
}

.book-author {
    font-size: 1rem;
    color: var(--text-muted);
}

@media (max-width: 768px) {
    .hero h1 {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<header id="navbar">
    <div class="nav-brand">
        <span>📚</span> <span>کتابخانه</span>
    </div>
    <div class="nav-actions">
        <button class="btn" onclick="toggleTheme()" title="تغییر تم (تاریک/سپیا/روشن)">🌓 <span>تم</span></button>
    </div>
</header>

<main class="main-container">
    <div class="hero">
        <h1>کتاب‌های ترجمه شده</h1>
        <p>مجموعه‌ای از رمان‌های جذاب با ترجمه فارسی</p>
    </div>

    <div class="books-grid">
        <a href="Alchemised.html" class="book-card">
            <div class="book-icon">📖</div>
            <div class="book-title">کیمیاشده (Alchemised)</div>
            <div class="book-author">اثری از سن‌لین‌یو (SenLinYu)</div>
        </a>

        <a href="threshing_day_fa.html" class="book-card">
            <div class="book-icon">🐉</div>
            <div class="book-title">Threshing Day</div>
            <div class="book-author">اثری از ربکا یاروس (Rebecca Yarros)</div>
        </a>
    </div>
</main>

<script>
    function toggleTheme() {
        const body = document.body;
        if (body.classList.contains('theme-light')) {
            body.classList.remove('theme-light');
            body.classList.add('theme-sepia');
            localStorage.setItem('theme', 'sepia');
        } else if (body.classList.contains('theme-sepia')) {
            body.classList.remove('theme-sepia');
            localStorage.setItem('theme', 'dark');
        } else {
            body.classList.add('theme-light');
            localStorage.setItem('theme', 'light');
        }
    }

    // Load saved theme
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('theme-light');
        } else if (savedTheme === 'sepia') {
            document.body.classList.add('theme-sepia');
        }
    });
</script>

</body>
</html>
